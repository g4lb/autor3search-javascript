# Publishes to npm with trusted publishing (OIDC) — no token, anywhere.
#
# npm mints a short-lived credential from GitHub's OIDC identity, so there is
# nothing to store, rotate or leak, and it attaches a provenance attestation
# linking the published tarball to this workflow run and commit.
#
# The npmjs.com side must name THIS FILE ("release.yml") as the trusted
# publisher for the package. Renaming this file breaks publishing until the
# trusted publisher is updated to match.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # The whole point: without id-token: write there is no OIDC token to exchange,
  # and npm falls back to asking for a credential that does not exist here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # registry-url is deliberately NOT set. npm publishes to
      # registry.npmjs.org by default, so it buys nothing here — and under
      # setup-node v4 it actively broke trusted publishing: it wrote an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and exported NODE_AUTH_TOKEN
      # as the literal placeholder "XXXXX-XXXXX-XXXXX-XXXXX" when no secret was
      # passed, which there isn't, by design. npm then had a credential, so it
      # authenticated with that placeholder and never attempted the OIDC
      # exchange at all, failing with a bare "404 Not Found - PUT" that reads
      # like a missing package rather than the auth failure it was.
      #
      # setup-node v7 removed that dummy export (actions/setup-node#1558), so
      # the trap is gone — but the option is still unnecessary, so it stays off.
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '22'
          cache: npm

      # setup-node ships the npm bundled with Node 22, which is 10.x — too old
      # for OIDC. Trusted publishing needs npm >= 11.5.1, so install it.
      - name: Install an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A release that was never tested on the platform it ships from is a
      # release whose users are the test.
      #
      # The state home is overridden exactly as ci.yml does it, so this gate
      # runs the suite under the conditions CI actually validated rather than
      # subtly different ones. Every test already isolates its own state — via
      # this variable or an explicit temp stateDir — so this is a safety net,
      # not a requirement: should one ever forget, its state lands in the
      # runner's temp and is cleaned up with the runner, instead of in the
      # runner's real home cache where it would outlive the job.
      - run: npm test
        env:
          AUTOR3SEARCH_JAVASCRIPT_STATE_HOME: ${{ runner.temp }}/a3s-state

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a name that says otherwise. Fail before the registry sees it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # No NODE_AUTH_TOKEN, and no .npmrc: npm must find no credential in order
      # to reach for the OIDC one. Provenance is automatic for a public package
      # built from a public repository, so --provenance is not passed either.
      - run: npm publish --access public
